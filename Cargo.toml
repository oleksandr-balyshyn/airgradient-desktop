[package]
name = "airgradient-desktop"
version = "0.2.2"
edition = "2021"
license = "MIT"

[dependencies]
# Relm4 is the UI framework, and it owns the whole gtk-rs dependency train. The
# app never declares gtk4, libadwaita, glib, gio or gdk-pixbuf itself; it uses
# Relm4's re-exports (`relm4::gtk`, `relm4::adw`, `relm4::gtk::gio`, ...). That
# makes it impossible to accidentally link two incompatible gtk-rs versions.
#
# The `gnome_45` feature is what selects the API level: it turns on libadwaita
# 1.4 bindings (AdwToolbarView, AdwEntryRow, AdwSpinRow, AdwBanner) and GTK 4.12
# bindings. It is deliberately not higher — the GitHub Actions Ubuntu 24.04
# image ships GTK 4.14 and libadwaita 1.5, so anything above this would build
# locally and fail in CI.
relm4 = { version = "0.11", features = ["libadwaita", "macros", "gnome_45"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ksni = { version = "0.3", features = ["blocking"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
url = "2.5"
