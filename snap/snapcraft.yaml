name: airgradient-desktop
title: Air Monitor
summary: Monitor an AirGradient local-server device
description: |
  📊 **Your AirGradient device, right on your desktop.**

  You've got an AirGradient monitor reporting great local air quality data,
  but checking it means opening a browser tab or walking over to glance at
  a small on-device display. Air Monitor puts those same readings directly
  on your GNOME desktop, always one glance away.

  🌬️ **A full air quality dashboard, at a glance:**

  * Air Quality Index (AQI), color-coded for quick reading.
  * Temperature and humidity.
  * CO2, TVOC, and NOx.
  * Particulate matter: PM0.3 count, PM1.0, PM2.5, and PM10.
  * Trend arrows comparing each reading to the previous one.
  * The timestamp of the last successful update.

  🔔 **Notified before air quality becomes a problem.**

  Air Monitor watches incoming readings and raises desktop notifications
  when CO2, AQI, PM2.5, TVOC, NOx, or humidity drift outside healthy ranges,
  or when the device goes offline. Alerts require a couple of consecutive
  bad readings and respect a cooldown window, so a single noisy sample
  won't spam your notification tray.

  🗂️ **Lives quietly in the tray.**

  Close the window and Air Monitor keeps polling in the background from a
  StatusNotifier tray icon, ready to reopen the dashboard, or quit outright,
  without losing your place.

  ⚙️ **Simple to point at your device.**

  Configure your AirGradient's local-server URL once in Settings and Air
  Monitor takes care of polling `/measures/current`, normalizing the
  payload, and keeping the dashboard current.

  🎨 **Built to feel native on Linux.**

  * Written in Rust with GTK 4 and libadwaita for a fast, native GNOME look.
  * Follows your system's light/dark theme.
  * Strictly confined, with network access only.

  ✅ **What you'll need:**

  * A Linux desktop with GTK 4 and libadwaita (GNOME works out of the box).
  * An AirGradient device exposing its local-server endpoint on your network.

  💜 Free and open source — source and issues live at
  https://github.com/oleksandr-balyshyn/airgradient-desktop

base: core24
adopt-info: airgradient-desktop
grade: stable
confinement: strict
compression: lzo
license: MIT
icon: usr/share/icons/hicolor/256x256/apps/com.airgradient.desktop.png
source-code:
  - https://github.com/oleksandr-balyshyn/airgradient-desktop
issues:
  - https://github.com/oleksandr-balyshyn/airgradient-desktop/issues
website:
  - https://github.com/oleksandr-balyshyn/airgradient-desktop

platforms:
  amd64:
    build-on: amd64
    build-for: amd64
  arm64:
    build-on: arm64
    build-for: arm64

apps:
  airgradient-desktop:
    command: bin/airgradient-desktop
    extensions: [gnome]
    desktop: usr/share/applications/com.airgradient.desktop.desktop
    common-id: com.airgradient.desktop
    plugs:
      - network

parts:
  rust-deps:
    plugin: nil
    build-packages:
      - curl
    override-pull: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile default --default-toolchain stable
      . "$HOME/.cargo/env"
      ln -sf "$HOME/.cargo/bin/cargo" /usr/local/bin/cargo
      ln -sf "$HOME/.cargo/bin/rustc" /usr/local/bin/rustc
      ln -sf "$HOME/.cargo/bin/rustup" /usr/local/bin/rustup

  airgradient-desktop:
    plugin: rust
    source: .
    rust-channel: none
    after:
      - rust-deps
    build-packages:
      - libadwaita-1-dev
      - libglib2.0-bin
      - libglib2.0-dev
      - libgtk-4-dev
      - pkg-config
    override-pull: |
      craftctl default
      version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
      if [ -z "${version}" ]; then
        echo "failed to read package version from Cargo.toml" >&2
        exit 1
      fi
      craftctl set version="${version}"
    override-build: |
      craftctl default
      install -Dm644 assets/com.airgradient.desktop.desktop \
        "${CRAFT_PART_INSTALL}/usr/share/applications/com.airgradient.desktop.desktop"
      install -Dm644 assets/com.airgradient.desktop.metainfo.xml \
        "${CRAFT_PART_INSTALL}/usr/share/metainfo/com.airgradient.desktop.metainfo.xml"
      install -Dm644 assets/airgradient-desktop.svg \
        "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/scalable/apps/com.airgradient.desktop.svg"
      install -Dm644 assets/airgradient-desktop.svg \
        "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/scalable/apps/airgradient-desktop.svg"
      install -Dm644 assets/airgradient-desktop.png \
        "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/256x256/apps/com.airgradient.desktop.png"
      install -Dm644 assets/airgradient-desktop.png \
        "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/256x256/apps/airgradient-desktop.png"
      install -Dm644 assets/airgradient-tray.png \
        "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/256x256/status/airgradient-tray.png"
      install -Dm644 assets/airgradient-tray.png \
        "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/256x256/status/airgradient-desktop.png"
      install -Dm644 assets/airgradient-tray.png \
        "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/256x256/status/com.airgradient.desktop.png"
